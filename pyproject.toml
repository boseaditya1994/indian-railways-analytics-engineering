[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "indian-railways-delay-analytics"
version = "0.1.0"
description = "A reproducible Indian Railways delay analytics and prediction platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "requests>=2.32,<3",
  "tenacity>=9.0,<10",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
warehouse = ["snowflake-connector-python>=3.13,<4"]
ml = ["pandas>=2.2,<3", "scikit-learn>=1.6,<2"]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6.0,<7", "ruff>=0.9,<1"]

[project.scripts]
railway-pipeline = "railway_pipeline.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/railway_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
