name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'dbt-core>=1.9,<2' 'dbt-snowflake>=1.9,<2'
      - run: dbt deps --project-dir dbt_railway
      - run: dbt parse --project-dir dbt_railway --profiles-dir .github/dbt

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboards/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run lint
      - run: npm run build
