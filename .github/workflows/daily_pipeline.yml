name: Daily pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  daily-pipeline:
    # Disabled until an approved source adapter and GitHub Secrets are configured.
    if: ${{ vars.ENABLE_DAILY_PIPELINE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[warehouse]'
      - run: railway-pipeline --mode daily
