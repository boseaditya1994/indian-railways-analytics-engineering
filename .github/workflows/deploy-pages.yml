name: Deploy portfolio dashboard

on:
  push:
    branches: [main]
    paths: ["dashboards/react/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: dashboards/react
        run: npm install && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboards/react/dist
      - id: deployment
        uses: actions/deploy-pages@v4
